# Loki em modo monolítico, para desenvolvimento local.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Logs com mais de 7 dias são descartados pelo compactador.
  retention_period: 168h
  # traceId e caminho chegam como metadado estruturado (não viram rótulo/série).
  allow_structured_metadata: true
  volume_enabled: true
  # service_name (usado pelo Logs Drilldown do Grafana) vem do rótulo servico, em vez de "unknown_service".
  discover_service_name: [servico]

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
